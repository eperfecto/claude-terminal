<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Claude Terminal Remote</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Noise texture overlay -->
  <svg class="noise-layer" aria-hidden="true"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#noiseFilter)"/></svg>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" class="pwa-install-banner hidden">
    <div class="pwa-install-content">
      <img src="icon-192.png" alt="" class="pwa-install-icon">
      <div class="pwa-install-text">
        <strong>Claude Terminal</strong>
        <span id="pwa-install-hint"></span>
      </div>
      <button id="pwa-install-btn" class="pwa-install-btn">Install</button>
      <button id="pwa-install-close" class="pwa-install-close">&times;</button>
    </div>
  </div>

  <div id="app">

    <!-- AUTH SCREEN -->
    <div id="screen-auth" class="screen">
      <div class="auth-container">
        <div class="auth-logo">
          <img src="icon.png" alt="Claude Terminal" width="68" height="68" style="border-radius: 20px;">
        </div>
        <h1 class="auth-title">Claude Terminal</h1>
        <p class="auth-subtitle">Remote Control</p>

        <!-- API key auth (Cloud mode) -->
        <div id="auth-cloud-section">
          <p class="auth-message" data-i18n="cloud.enterKey"></p>
          <div class="cloud-key-input-row">
            <input id="cloud-key-input" class="cloud-key-input" type="password" placeholder="ctc_..." autocomplete="off" spellcheck="false">
            <button id="cloud-key-submit-btn" class="pin-submit-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
          <div id="cloud-key-error" class="pin-error hidden" data-i18n="cloud.keyError"></div>
        </div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="screen-main" class="screen hidden">
      <!-- Header -->
      <header class="app-header hidden">
        <div class="header-left">
          <button id="header-back" class="header-back hidden" onclick="backToProjects()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>
          <span class="header-title" id="header-title">Terminal</span>
        </div>
        <div class="header-right">
          <span class="connection-status" id="connection-dot">
            <span class="status-dot"></span>
          </span>
        </div>
      </header>

      <!-- Reconnecting banner -->
      <div id="reconnecting-banner" class="reconnecting-banner hidden">
        <div class="reconnecting-pulse"></div>
        <span data-i18n="status.reconnecting"></span>
      </div>

      <!-- PROJECTS VIEW -->
      <div id="view-projects" class="view">
        <div class="view-inner">
          <div class="view-header">
            <h2 class="view-title" data-i18n="nav.projects"></h2>
            <span class="view-count" id="projects-count">0</span>
            <span class="view-count view-version" id="server-version" hidden></span>
          </div>
          <input type="search" id="projects-search" class="projects-search"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 data-i18n-placeholder="project.searchPlaceholder">
          <div id="projects-list" class="projects-list"></div>
          <div id="projects-no-matches" class="empty-state hidden">
            <p data-i18n="project.noMatches"></p>
          </div>
          <div id="projects-empty" class="empty-state hidden">
            <div class="empty-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              </svg>
            </div>
            <p data-i18n="project.noProjects"></p>
          </div>
        </div>
      </div>

      <!-- CHAT VIEW -->
      <div id="view-chat" class="view hidden">
        <div class="view-inner chat-view-inner">
          <div id="session-bar" class="session-bar hidden">
            <select id="session-select" class="session-select"></select>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <button id="scroll-fab" class="scroll-fab hidden" onclick="_scrollToBottomSmooth()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
          </button>
          <div id="thinking-indicator" class="thinking-indicator hidden">
            <div class="thinking-brain">
              <span class="thinking-dot"></span>
              <span class="thinking-dot"></span>
              <span class="thinking-dot"></span>
            </div>
            <span class="thinking-label" data-i18n="status.thinking"></span>
          </div>
        </div>
        <!-- Input bar -->
        <div class="chat-input-area">
          <div id="autocomplete-dropdown" class="autocomplete-dropdown hidden"></div>
          <div class="chat-input-bar">
            <button id="plus-menu-btn" class="plus-menu-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <!-- Plus menu popup -->
            <div id="plus-menu" class="plus-menu hidden">
              <div class="plus-menu-section">
                <div class="plus-menu-label" data-i18n="misc.model"></div>
                <div class="plus-menu-options" id="model-options">
                  <button class="plus-option" data-model="claude-sonnet-5">
                    <span class="plus-option-name">Sonnet 5</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-model="claude-sonnet-4-6">
                    <span class="plus-option-name">Sonnet 4.6</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-model="claude-opus-5">
                    <span class="plus-option-name">Opus 5</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-model="claude-opus-4-8">
                    <span class="plus-option-name">Opus 4.8</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-model="claude-opus-4-7">
                    <span class="plus-option-name">Opus 4.7</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-model="claude-haiku-4-5-20251001">
                    <span class="plus-option-name">Haiku 4.5</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                </div>
              </div>
              <div class="plus-menu-divider"></div>
              <div class="plus-menu-section">
                <div class="plus-menu-label" data-i18n="misc.thinking"></div>
                <div class="plus-menu-options" id="effort-options">
                  <button class="plus-option" data-effort="low">
                    <span class="plus-option-name">Low</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-effort="medium">
                    <span class="plus-option-name">Medium</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-effort="high">
                    <span class="plus-option-name">High</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                  <button class="plus-option" data-effort="xhigh">
                    <span class="plus-option-name">XHigh</span>
                    <span class="plus-option-check hidden">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                  </button>
                </div>
              </div>
            </div>
            <div class="input-wrapper">
              <textarea id="chat-input" class="chat-input" placeholder="Message Claude..." rows="1"></textarea>
            </div>
            <button id="send-btn" class="send-btn" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
              </svg>
            </button>
            <button id="interrupt-btn" class="interrupt-btn hidden">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="3"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- DASHBOARD VIEW -->
      <div id="view-dashboard" class="view hidden">
        <div class="view-inner">
          <div class="view-header">
            <h2 class="view-title" data-i18n="nav.dashboard"></h2>
          </div>
          <div id="dashboard-content" class="dashboard-content">
            <!-- Hero: Time today (full width) -->
            <div class="dash-card dash-card-hero">
              <div class="dash-card-glow"></div>
              <div class="dash-card-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <div class="dash-card-body">
                <div class="dash-card-label" data-i18n="dashboard.timeToday"></div>
                <div class="dash-card-value" id="dash-time">0m</div>
              </div>
            </div>
            <!-- Bento grid 2x -->
            <div class="dash-bento">
              <div class="dash-card dash-card-mini">
                <div class="dash-card-icon dash-card-icon-sm">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                  </svg>
                </div>
                <div class="dash-card-body">
                  <div class="dash-card-label" data-i18n="dashboard.activeProject"></div>
                  <div class="dash-card-value dash-card-value-sm" id="dash-project">&mdash;</div>
                </div>
              </div>
              <div class="dash-card dash-card-mini">
                <div class="dash-card-icon dash-card-icon-sm">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                  </svg>
                </div>
                <div class="dash-card-body">
                  <div class="dash-card-label" data-i18n="dashboard.sessions"></div>
                  <div class="dash-card-value dash-card-value-sm" id="dash-sessions">0</div>
                </div>
              </div>
            </div>
            <div class="dash-section-title" data-i18n="dashboard.projectsSection"></div>
            <div id="projects-status-list" class="projects-status-list"></div>
          </div>
        </div>
      </div>

      <!-- MISSION CONTROL VIEW -->
      <div id="view-control" class="view hidden">
        <div class="view-inner">
          <div class="view-header">
            <h2 class="view-title" data-i18n="control.title"></h2>
            <span class="view-count" id="control-count">0</span>
          </div>
          <div id="control-list" class="control-list"></div>
          <div id="control-empty" class="control-empty">
            <div class="empty-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
            </div>
            <p data-i18n="control.noSessions"></p>
          </div>
        </div>
      </div>

      <!-- SESSIONS VIEW (inside project hub) -->
      <div id="view-sessions" class="view hidden">
        <div class="view-inner">
          <div id="sessions-list" class="sessions-list"></div>
          <button id="btn-new-session" class="new-session-btn" onclick="createNewSession()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="new-session-label" data-i18n="session.new"></span>
          </button>
        </div>
      </div>

      <!-- BOTTOM NAVIGATION -->
      <nav class="bottom-nav" id="bottom-nav">
        <div class="nav-pill" id="nav-pill"></div>
        <!-- Global nav -->
        <div class="nav-group" id="nav-global">
          <button class="nav-item active" data-view="projects">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
            <span data-i18n="nav.projects"></span>
          </button>
          <button class="nav-item" data-view="chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span data-i18n="nav.chat"></span>
            <span id="chat-badge" class="nav-badge hidden"></span>
          </button>
          <button class="nav-item" data-view="control">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
            </svg>
            <span data-i18n="nav.control"></span>
          </button>
          <button class="nav-item" data-view="dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            <span data-i18n="nav.dashboard"></span>
          </button>
        </div>
        <!-- Project nav (hidden by default) -->
        <div class="nav-group hidden" id="nav-project">
          <button class="nav-item active" data-view="sessions">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="4" rx="1"/><rect x="2" y="10" width="20" height="4" rx="1"/><rect x="2" y="17" width="20" height="4" rx="1"/>
            </svg>
            <span data-i18n="nav.tabs"></span>
          </button>
        </div>
      </nav>

    </div>

  </div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
